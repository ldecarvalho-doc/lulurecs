<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lulurecs · recommendations for friends</title>
<meta name="description" content="Lu's recommendations for friends — shows, movies, and more.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23f87171'/%3E%3Cstop offset='20%25' stop-color='%23fb923c'/%3E%3Cstop offset='40%25' stop-color='%23facc15'/%3E%3Cstop offset='60%25' stop-color='%234ade80'/%3E%3Cstop offset='80%25' stop-color='%2360a5fa'/%3E%3Cstop offset='100%25' stop-color='%23c084fc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%2312101a'/%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #12101a;
    --surface: #1c1927;
    --surface-2: #262234;
    --border: #363048;
    --text: #efecf6;
    --text-dim: #a49cba;
    --accent: #c084fc;
    --accent-2: #f472b6;
    --heart: #fb7185;
    --ok: #4ade80;
    --err: #fb7185;
    --radius: 14px;
    --rainbow: linear-gradient(90deg, #f87171, #fb923c, #facc15, #4ade80, #60a5fa, #c084fc);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    min-height: 100vh;
  }
  .rainbow-bar { height: 5px; background: var(--rainbow); }
  header {
    max-width: 1100px; margin: 0 auto; padding: 32px 20px 8px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  header h1 { font-size: 2rem; letter-spacing: -0.5px; }
  header h1 .spark {
    background: var(--rainbow);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p.tag { color: var(--text-dim); margin-top: 4px; }
  .admin-link {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 999px; padding: 7px 16px; font-size: 0.82rem; text-decoration: none;
    white-space: nowrap; flex: 0 0 auto; margin-top: 4px;
  }
  .admin-link:hover { border-color: var(--accent); color: var(--text); }

  nav.cats { max-width: 1100px; margin: 18px auto 0; padding: 0 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  nav.cats button {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 16px; cursor: pointer; font-size: 0.92rem;
  }
  nav.cats button.active { border-color: var(--accent); background: var(--surface-2); }
  nav.cats button:disabled { opacity: 0.4; cursor: default; }

  .lists {
    max-width: 1100px; margin: 12px auto 0; padding: 0 20px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .lists .lists-label { color: var(--text-dim); font-size: 0.8rem; }
  .lists button {
    background: transparent; border: 1px dashed var(--accent); color: var(--accent);
    border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 0.88rem;
  }
  .lists button.active { background: var(--surface-2); border-style: solid; }
  .list-header {
    background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius);
    padding: 14px 18px; margin-bottom: 14px; display: none;
  }
  .list-header h2 { font-size: 1.1rem; }
  .list-header p { color: var(--text-dim); font-size: 0.9rem; margin: 4px 0 6px; }
  .list-header a.clear { color: var(--accent-2); font-size: 0.85rem; text-decoration: none; }

  .controls {
    max-width: 1100px; margin: 20px auto 0; padding: 0 20px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .controls input[type="search"], .controls select {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; font-size: 0.95rem;
  }
  .controls input[type="search"] { flex: 1 1 220px; min-width: 180px; }
  .controls select { flex: 0 0 auto; }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; font-size: 0.95rem; user-select: none; color: var(--text);
  }
  .toggle.active { border-color: var(--heart); color: var(--heart); }
  .toggle.reset { font-family: inherit; color: var(--accent-2); border-color: var(--accent-2); }
  .toggle.reset.hidden, .toggle.share.hidden, .toggle.private.hidden { display: none; }
  .toggle.private { font-family: inherit; color: var(--warn, #facc15); border-color: var(--warn, #facc15); }
  body.only-mode .list-header a.clear { display: none; }
  .card.is-private { border-style: dashed; }
  .card.is-private .card-top h2::after { content: " 🔒"; font-size: 0.8em; opacity: 0.8; }
  .toggle.share { font-family: inherit; color: var(--accent); border-color: var(--border); }
  .toggle.share:hover { border-color: var(--accent); }
  .toggle.reset:hover { background: var(--surface-2); }

  .layout {
    max-width: 1100px; margin: 16px auto 60px; padding: 0 20px;
    display: flex; gap: 20px; align-items: flex-start;
  }
  aside.tagbar {
    flex: 0 0 200px; position: sticky; top: 16px;
    display: flex; flex-direction: column; gap: 10px;
    max-height: calc(100vh - 32px); overflow-y: auto;
    scrollbar-width: thin;
  }
  .tag-group { display: flex; flex-direction: column; gap: 5px; }
  .tag-group .group-head {
    color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 1px; padding: 2px 4px; cursor: pointer; user-select: none;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .tag-group .group-head:hover { color: var(--text); }
  .tag-group .caret { transition: transform 0.15s ease; font-size: 0.8em; }
  .tag-group.collapsed .caret { transform: rotate(-90deg); }
  .tag-group.collapsed .chips { display: none; }
  .tag-group.selected-group .group-head { color: var(--accent-2); }
  .chips { display: flex; flex-direction: column; gap: 5px; }
  .tagbar .chip {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; padding: 5px 12px; font-size: 0.8rem; cursor: pointer;
    text-align: left;
  }
  .tagbar .chip:hover { border-color: var(--accent); }
  .tagbar .chip.active { border-color: var(--accent-2); color: var(--accent-2); }
  .tagbar .chip .info-dot { opacity: 0.7; font-size: 0.75em; }
  .tagbar .clear-all {
    background: none; border: none; color: var(--accent-2); cursor: pointer;
    font-size: 0.7rem; text-transform: none; letter-spacing: 0; padding: 0;
  }
  .content { flex: 1; min-width: 0; }
  .tag-info {
    background: var(--surface); border: 1px solid var(--accent-2); border-radius: var(--radius);
    padding: 12px 40px 12px 16px; margin-bottom: 12px; position: relative;
  }
  .tag-info .close {
    position: absolute; top: 8px; right: 10px; background: none; border: none;
    color: var(--text-dim); font-size: 1.25rem; line-height: 1; cursor: pointer; padding: 4px;
  }
  .tag-info .close:hover { color: var(--accent-2); }
  .tag-info h3 { font-size: 0.95rem; color: var(--accent-2); }
  .tag-info p { color: var(--text-dim); font-size: 0.88rem; margin-top: 3px; white-space: pre-line; }
  .tag-info + .tag-info { margin-top: -4px; }

  .count { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 12px; }

  main.grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px;
  }
  @media (max-width: 720px) {
    .layout { flex-direction: column; }
    aside.tagbar { position: static; flex: none; width: 100%; max-height: none; }
    .chips { flex-direction: row; flex-wrap: wrap; }
    .tagbar .chip { border-radius: 999px; }
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column; position: relative;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .poster { height: 150px; position: relative; background-size: cover; background-position: center 25%; }
  .poster.placeholder {
    display: flex; align-items: center; justify-content: center;
    font-size: 2.6rem; font-weight: 700; color: rgba(255,255,255,0.85);
  }
  .fav-btn {
    position: absolute; top: 10px; right: 10px; border: none; cursor: pointer;
    background: rgba(18,16,26,0.65); backdrop-filter: blur(4px);
    border-radius: 999px; width: 38px; height: 38px; font-size: 1.15rem; line-height: 1;
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .fav-btn.faved { color: var(--heart); }
  .burger-btn {
    position: absolute; top: 10px; left: 10px; border: none; cursor: pointer;
    background: rgba(18,16,26,0.65); backdrop-filter: blur(4px);
    border-radius: 999px; width: 32px; height: 32px; font-size: 1.1rem; line-height: 1;
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .burger-btn:hover { background: rgba(18,16,26,0.85); }
  .action-menu {
    position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; width: 240px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .action-menu.hidden { display: none; }
  .action-menu .menu-item {
    display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text);
    padding: 8px 6px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
  }
  .action-menu .menu-item:hover { background: var(--surface-2); }
  .action-menu .menu-hint { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 6px; }
  .action-menu .menu-check { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; padding: 5px 2px; cursor: pointer; }
  .action-menu input[type="password"] {
    width: 100%; margin-bottom: 8px; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 7px 9px; font-size: 0.85rem;
  }
  .action-menu .menu-actions { display: flex; gap: 8px; margin-top: 8px; }
  .action-menu .menu-btn {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 0.85rem;
  }
  .action-menu .menu-btn.primary { background: var(--accent); color: #1a1025; border-color: var(--accent); font-weight: 600; }
  .action-menu .menu-status { font-size: 0.8rem; margin-top: 6px; }
  .action-menu .ok { color: var(--ok); }
  .action-menu .err { color: var(--err); }
  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card-top h2 { font-size: 1.08rem; line-height: 1.3; }
  .meta { color: var(--text-dim); font-size: 0.83rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 1px 7px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .stars { color: var(--accent-2); font-size: 0.9rem; letter-spacing: 1px; }
  .stars .off { color: var(--border); }
  .desc { color: var(--text-dim); font-size: 0.88rem; }
  details.notes { font-size: 0.88rem; }
  details.notes summary {
    cursor: pointer; color: var(--accent); font-size: 0.85rem; user-select: none;
  }
  details.notes p {
    margin-top: 6px; background: var(--surface-2); border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; padding: 8px 10px; white-space: pre-wrap;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .card-tags span {
    font-size: 0.72rem; color: var(--text-dim); background: var(--surface-2);
    border-radius: 999px; padding: 2px 9px; cursor: pointer;
  }
  .card-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
  .card-links a {
    color: var(--accent); text-decoration: none; font-size: 0.83rem;
    border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px;
  }
  .card-links a:hover { border-color: var(--accent); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--text-dim); padding: 60px 0; }
  footer { text-align: center; color: var(--text-dim); font-size: 0.8rem; padding: 24px 20px 40px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="rainbow-bar"></div>
<header>
  <div>
    <h1>lulurecs <span class="spark">✦</span></h1>
    <p class="tag">All the stuff I've ever consumed and that I recommend (or not)</p>
  </div>
  <a class="admin-link" href="admin.html">⚙️ Admin</a>
</header>

<nav class="cats" id="cats"></nav>
<div class="lists" id="lists"></div>

<div class="controls">
  <input type="search" id="search" placeholder="Search titles, notes, descriptions…">
  <select id="typeFilter"><option value="">All types</option></select>
  <select id="countryFilter"><option value="">All countries</option></select>
  <select id="sort">
    <option value="curated">Sort: Curated order</option>
    <option value="rating">Sort: Lu's rating</option>
    <option value="title">Sort: Title A–Z</option>
    <option value="year-desc">Sort: Newest</option>
    <option value="year-asc">Sort: Oldest</option>
  </select>
  <span class="toggle" id="favToggle">♥ Favorites</span>
  <button class="toggle reset hidden" id="resetBtn" title="Clear search, filters and tags">✕ Reset filters</button>
  <button class="toggle share hidden" id="shareBtn" title="Copy a link to exactly this view">🔗 Copy link</button>
  <button class="toggle share hidden" id="focusBtn" title="Copy a link that shows ONLY this list — no category tabs, nothing else to browse">🙈 Copy focused link</button>
  <button class="toggle private hidden" id="privateBtn" title="Private entries are visible to you — click to hide them again">🔓 private shown</button>
</div>

<div class="layout">
  <aside class="tagbar" id="tagbar" aria-label="Filter by tag"></aside>
  <div class="content">
    <div class="list-header" id="listHeader"></div>
    <div id="tagInfoWrap"></div>
    <div class="count" id="count"></div>
    <main class="grid" id="grid"></main>
  </div>
</div>

<footer>
  made with ♥ by Lu · favorites are saved in your browser ·
  <a href="https://github.com/ldecarvalho-doc/lulurecs" target="_blank" rel="noopener">source</a>
</footer>

<div id="actionMenu" class="action-menu hidden"></div>

<script>
(() => {
  const FAV_KEY = "lulurecs:favorites";
  const COUNTRY_NAMES = {
    NO: "Norway", DE: "Germany", FR: "France", IT: "Italy", BE: "Belgium",
    TH: "Thailand", TW: "Taiwan", JP: "Japan", KR: "South Korea", PH: "Philippines",
    GB: "UK", US: "USA", BR: "Brazil"
  };
  const TYPE_LABELS = { series: "Series", movie: "Movie", musical: "Musical", list: "List", book: "Book", album: "Album", channel: "Channel" };
  const PLACEHOLDER_GRADIENTS = [
    "linear-gradient(135deg,#7c3aed,#db2777)", "linear-gradient(135deg,#0ea5e9,#8b5cf6)",
    "linear-gradient(135deg,#f59e0b,#ef4444)", "linear-gradient(135deg,#10b981,#3b82f6)",
    "linear-gradient(135deg,#ec4899,#f97316)", "linear-gradient(135deg,#6366f1,#14b8a6)"
  ];

  let categories = [], items = [], activeCat = null;
  const catButtons = {};
  let applyingHash = false;
  const PRIVATE_KEY = "lulurecs:showPrivate";
  let showPrivate = localStorage.getItem(PRIVATE_KEY) === "1";
  let onlyMode = false; // focused share link: no category nav, no way to browse onward
  let lists = [], activeList = null, allItemsCache = null;
  let tagInfo = {}, tagGroups = [], tagCounts = {};
  const COLLAPSE_KEY = "lulurecs:collapsedGroups";
  let collapsed = new Set((() => { try { return JSON.parse(localStorage.getItem(COLLAPSE_KEY)) || []; } catch { return []; } })());
  const state = { search: "", type: "", country: "", tags: new Set(), favsOnly: false, sort: "title" };

  const $ = id => document.getElementById(id);
  const flag = cc => cc ? cc.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0))) : "";
  const getFavs = () => { try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); } catch { return new Set(); } };
  const setFavs = favs => localStorage.setItem(FAV_KEY, JSON.stringify([...favs]));
  const hue = str => [...str].reduce((a, c) => a + c.charCodeAt(0), 0);

  async function loadCategories() {
    categories = await (await fetch("data/categories.json")).json();
    const nav = $("cats");
    nav.innerHTML = "";
    const allBtn = document.createElement("button");
    allBtn.textContent = "✨ All";
    allBtn.onclick = () => selectAll(allBtn);
    nav.appendChild(allBtn);
    catButtons["all"] = allBtn;
    categories.filter(cat => cat.enabled && (showPrivate || !cat.private)).forEach(cat => {
      const b = document.createElement("button");
      b.textContent = `${cat.emoji} ${cat.name}`;
      b.onclick = () => selectCategory(cat, b);
      nav.appendChild(b);
      catButtons[cat.id] = b;
    });
  }

  async function selectAll(btn) {
    activeCat = { id: "__all__", name: "All" };
    activeList = null;
    [...$("cats").children].forEach(b => b.classList.remove("active"));
    document.querySelectorAll("#lists button").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
    state.sort = "title"; $("sort").value = "title";
    items = await allItems();
    buildFilters();
    render();
  }

  async function selectCategory(cat, btn) {
    activeCat = cat;
    activeList = null;
    [...$("cats").children].forEach(b => b.classList.remove("active"));
    document.querySelectorAll("#lists button").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
    state.sort = "title"; $("sort").value = "title";
    const all = await allItems();
    items = all.filter(i => (i.categories || []).includes(cat.id));
    buildFilters();
    render();
  }

  function renderPlaceholder() {
    $("listHeader").style.display = "none";
    $("tagInfoWrap").innerHTML = "";
    $("tagbar").innerHTML = "";
    $("count").textContent = "";
    $("grid").innerHTML = '<div class="empty">👋 Pick a category above — or hit ✨ All — to start browsing.</div>';
  }

  async function loadLists() {
    try { lists = await (await fetch("data/lists.json")).json(); } catch { lists = []; }
    const bar = $("lists");
    if (!lists.length) { bar.style.display = "none"; return; }
    bar.innerHTML = '<span class="lists-label">✨ rec lists:</span>';
    lists.forEach(l => {
      const b = document.createElement("button");
      b.textContent = l.title;
      b.dataset.listId = l.id;
      b.onclick = () => (activeList && activeList.id === l.id) ? selectAll($("cats").children[0]) : selectList(l);
      bar.appendChild(b);
    });
  }

  async function allItems() {
    if (!allItemsCache) {
      const enabled = categories.filter(c => c.enabled);
      const files = await Promise.all(enabled.map(c =>
        fetch(c.file).then(r => r.json()).then(arr => arr.map(i => ({ ...i, __file: c.file })))
      ));
      allItemsCache = files.flat();
    }
    // entries marked "private": true stay out of every view unless unlocked
    return showPrivate ? allItemsCache : allItemsCache.filter(i => !i.private);
  }

  async function selectList(l) {
    activeList = l;
    activeCat = null;
    const all = await allItems();
    items = l.items.map(id => all.find(i => i.id === id)).filter(Boolean);
    [...$("cats").children].forEach(b => b.classList.remove("active"));
    document.querySelectorAll("#lists button").forEach(b => b.classList.toggle("active", b.dataset.listId === l.id));
    state.sort = "curated"; $("sort").value = "curated";
    buildFilters();
    render();
  }

  function buildFilters() {
    const typeSel = $("typeFilter"), ctrySel = $("countryFilter");
    typeSel.innerHTML = '<option value="">All types</option>';
    [...new Set(items.map(i => i.type))].sort().forEach(t => {
      typeSel.insertAdjacentHTML("beforeend", `<option value="${t}">${TYPE_LABELS[t] || t}</option>`);
    });
    ctrySel.innerHTML = '<option value="">All countries</option>';
    [...new Set(items.map(i => i.country).filter(Boolean))]
      .sort((a, b) => (COUNTRY_NAMES[a] || a).localeCompare(COUNTRY_NAMES[b] || b))
      .forEach(c => {
        ctrySel.insertAdjacentHTML("beforeend", `<option value="${c}">${flag(c)} ${COUNTRY_NAMES[c] || c}</option>`);
      });
    tagCounts = {};
    items.forEach(i => (i.tags || []).forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1));
    state.type = ""; state.country = ""; state.tags.clear();
    typeSel.value = ""; ctrySel.value = "";
  }

  function chipHtml(t, active) {
    const info = tagInfo[t];
    return `<span class="chip${active ? " active" : ""}" data-tag="${t}"` +
      (info ? ` title="${(info.description || "").replace(/"/g, "&quot;").slice(0, 300)}"` : "") +
      `>${t} (${tagCounts[t] || 0})${info ? ' <span class="info-dot">ⓘ</span>' : ""}</span>`;
  }

  function groupHtml(id, label, tags, opts = {}) {
    if (!tags.length) return "";
    const isCollapsed = collapsed.has(id) && !opts.pinned;
    return `<div class="tag-group${isCollapsed ? " collapsed" : ""}${opts.pinned ? " selected-group" : ""}" data-group="${id}">
      <div class="group-head">${label}
        ${opts.pinned ? '<button class="clear-all">clear all</button>' : '<span class="caret">▾</span>'}
      </div>
      <div class="chips">${tags.map(t => chipHtml(t, opts.pinned)).join("")}</div>
    </div>`;
  }

  function renderTagbar() {
    const tagbar = $("tagbar");
    const present = Object.keys(tagCounts);
    if (!present.length) { tagbar.innerHTML = ""; return; }
    const sel = [...state.tags];
    const taken = new Set(sel);
    let html = groupHtml("__selected", "Filtering by", sel, { pinned: true });
    tagGroups.forEach(g => {
      html += groupHtml(g.id, g.label, g.tags.filter(t => tagCounts[t] && !taken.has(t)));
    });
    const grouped = new Set(tagGroups.flatMap(g => g.tags));
    const other = present.filter(t => !grouped.has(t) && !taken.has(t))
      .sort((a, b) => tagCounts[b] - tagCounts[a] || a.localeCompare(b));
    html += groupHtml("__other", "More", other);
    tagbar.innerHTML = html;

    tagbar.querySelectorAll(".chip").forEach(c => c.onclick = () => {
      const t = c.dataset.tag;
      state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t);
      render();
    });
    tagbar.querySelectorAll(".group-head").forEach(h => h.onclick = e => {
      if (e.target.classList.contains("clear-all")) { state.tags.clear(); return render(); }
      const id = h.parentElement.dataset.group;
      if (id === "__selected") return;
      collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
      localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsed]));
      h.parentElement.classList.toggle("collapsed");
    });
  }

  function filtered() {
    const favs = getFavs();
    const q = state.search.trim().toLowerCase();
    let out = items.filter(i => {
      if (state.favsOnly && !favs.has(i.id)) return false;
      if (state.type && i.type !== state.type) return false;
      if (state.country && i.country !== state.country) return false;
      if (state.tags.size && ![...state.tags].every(t => (i.tags || []).includes(t))) return false;
      if (q) {
        const hay = [i.title, i.description, i.notes, (i.tags || []).join(" "), COUNTRY_NAMES[i.country] || ""].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const s = state.sort;
    if (s === "curated") return out;
    out.sort((a, b) => {
      if (s === "title") return a.title.localeCompare(b.title);
      if (s === "year-desc") return (b.year || 0) - (a.year || 0);
      if (s === "year-asc") return (a.year || 0) - (b.year || 0);
      return (b.luRating || 0) - (a.luRating || 0) || a.title.localeCompare(b.title);
    });
    return out;
  }

  function stars(n) {
    if (!n) return '<span class="stars off" title="Not rated yet">·····</span>';
    const full = Math.floor(n), frac = n - full;
    let s = "★".repeat(full);
    if (frac >= 0.25) s += "½";
    const shown = full + (frac >= 0.25 ? 1 : 0);
    s += '<span class="off">' + "★".repeat(Math.max(0, 5 - shown)) + "</span>";
    return `<span class="stars" title="Lu's rating: ${n}/5">${s}</span>` +
      (frac ? ` <span title="Lu's rating">${n}</span>` : "");
  }

  function render() {
    const favs = getFavs();
    const lh = $("listHeader");
    if (activeList) {
      lh.style.display = "block";
      lh.innerHTML = `<h2>✨ ${activeList.title}</h2>` +
        (activeList.description ? `<p>${activeList.description}</p>` : "") +
        `<a class="clear" href="#">← back to all recs</a>`;
      lh.querySelector("a.clear").onclick = e => {
        e.preventDefault();
        selectAll($("cats").children[0]);
      };
    } else {
      lh.style.display = "none";
    }
    $("tagInfoWrap").innerHTML = [...state.tags]
      .filter(t => tagInfo[t])
      .map(t => `<div class="tag-info"><button class="close" data-tag="${t}" title="Remove this filter" aria-label="Remove filter">×</button><h3>${tagInfo[t].label || "#" + t}</h3><p>${tagInfo[t].description}</p></div>`)
      .join("");
    $("tagInfoWrap").querySelectorAll(".close").forEach(b => {
      b.onclick = () => { state.tags.delete(b.dataset.tag); render(); };
    });
    renderTagbar();
    $("favToggle").classList.toggle("active", state.favsOnly);
    const filtering = !!(state.search || state.type || state.country || state.tags.size || state.favsOnly);
    $("resetBtn").classList.toggle("hidden", !filtering);
    $("shareBtn").classList.toggle("hidden", !(activeCat || activeList) || onlyMode);
    $("focusBtn").classList.toggle("hidden", !activeList || onlyMode);
    $("privateBtn").classList.toggle("hidden", !showPrivate);
    syncHash();
    const list = filtered();
    $("count").textContent = `${list.length} of ${items.length} recs` + (state.favsOnly ? " · showing your favorites" : "");
    const grid = $("grid");
    grid.innerHTML = "";
    if (!list.length) {
      grid.innerHTML = '<div class="empty">Nothing matches — try clearing some filters 💜</div>';
      return;
    }
    list.forEach(i => {
      const card = document.createElement("article");
      card.className = "card" + (i.private ? " is-private" : "");
      const posterStyle = i.poster
        ? `background-image:url('${i.poster}')`
        : `background:${PLACEHOLDER_GRADIENTS[hue(i.id) % PLACEHOLDER_GRADIENTS.length]}`;
      card.innerHTML = `
        <div class="poster ${i.poster ? "" : "placeholder"}" style="${posterStyle}">
          ${i.poster ? "" : (i.title[0] || "?")}
          <button class="burger-btn" title="More actions" aria-label="More actions">⋮</button>
          <button class="fav-btn ${favs.has(i.id) ? "faved" : ""}" title="Save to favorites" aria-label="Toggle favorite">${favs.has(i.id) ? "♥" : "♡"}</button>
        </div>
        <div class="card-body">
          <div class="card-top"><h2>${i.title}</h2></div>
          <div class="meta">
            <span>${flag(i.country)} ${COUNTRY_NAMES[i.country] || i.country || ""}</span>
            <span class="badge">${TYPE_LABELS[i.type] || i.type}</span>
            ${i.year ? `<span>${i.year}</span>` : ""}
            ${stars(i.luRating)}
          </div>
          ${i.description ? `<p class="desc">${i.description}</p>` : ""}
          ${i.notes ? `<details class="notes"><summary>💬 Lu's notes</summary><p>${i.notes}</p></details>` : ""}
          ${(i.tags || []).length ? `<div class="card-tags">${i.tags.map(t => `<span data-tag="${t}">#${t}</span>`).join("")}</div>` : ""}
          ${(i.links || []).length ? `<div class="card-links">${i.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a>`).join("")}</div>` : ""}
        </div>`;
      card.querySelector(".fav-btn").onclick = () => {
        const f = getFavs();
        f.has(i.id) ? f.delete(i.id) : f.add(i.id);
        setFavs(f);
        render();
      };
      card.querySelector(".burger-btn").onclick = e => {
        e.stopPropagation();
        openBurger(i, e.currentTarget);
      };
      card.querySelectorAll(".card-tags span").forEach(el => {
        el.onclick = () => { state.tags.add(el.dataset.tag); render(); };
      });
      grid.appendChild(card);
    });
  }

  // ---------- QUICK-EDIT (burger menu: Add to list / Add to category) ----------
  const OWNER = "ldecarvalho-doc", REPO = "lulurecs", BRANCH = "main";
  const GH_API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
  const PAT_KEY = "lulurecs:pat";
  const b64e = s => btoa(unescape(encodeURIComponent(s)));
  const b64d = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));

  async function ghGet(path) {
    const token = localStorage.getItem(PAT_KEY) || "";
    const r = await fetch(GH_API + path + `?ref=${BRANCH}&t=${Date.now()}`, {
      headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
    });
    if (!r.ok) throw new Error(`GitHub ${r.status} — check your token`);
    return r.json();
  }
  async function ghPut(path, dataArr, sha, message) {
    const token = localStorage.getItem(PAT_KEY) || "";
    const body = { message, branch: BRANCH, content: b64e(JSON.stringify(dataArr, null, 2) + "\n") };
    if (sha) body.sha = sha;
    const r = await fetch(GH_API + path, {
      method: "PUT",
      headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || `GitHub ${r.status}`);
    return r.json();
  }

  let menuTarget = null, menuBtn = null;

  function closeMenu() { $("actionMenu").classList.add("hidden"); menuTarget = null; menuBtn = null; }

  function positionMenu(btn) {
    const menu = $("actionMenu");
    const r = btn.getBoundingClientRect();
    const w = 240;
    let left = Math.min(r.left, window.innerWidth - w - 12);
    menu.style.left = Math.max(10, left) + "px";
    menu.style.top = Math.min(r.bottom + 6, window.innerHeight - 60) + "px";
  }

  function openBurger(item, btn) {
    menuTarget = item; menuBtn = btn;
    const menu = $("actionMenu");
    const token = localStorage.getItem(PAT_KEY);
    if (!token) {
      menu.innerHTML = `<p class="menu-hint">Connect your token to add to lists or categories.</p>
        <input type="password" id="menuTokenInput" placeholder="github_pat_…">
        <div class="menu-actions">
          <button class="menu-btn primary" id="menuConnectBtn">Connect</button>
          <button class="menu-btn" id="menuCancel">Cancel</button>
        </div>`;
      menu.querySelector("#menuCancel").onclick = closeMenu;
      menu.querySelector("#menuConnectBtn").onclick = () => {
        const t = menu.querySelector("#menuTokenInput").value.trim();
        if (!t) return;
        localStorage.setItem(PAT_KEY, t);
        openBurger(item, btn);
      };
    } else {
      menu.innerHTML = `
        <button class="menu-item" id="menuAddList">＋ Add to list</button>
        <button class="menu-item" id="menuAddCat">🏷️ Add to category</button>
        <button class="menu-item" id="menuEdit">✏️ Edit in admin</button>
        <button class="menu-item" id="menuForget">Forget token</button>`;
      menu.querySelector("#menuAddList").onclick = showListPicker;
      menu.querySelector("#menuAddCat").onclick = showCategoryPicker;
      menu.querySelector("#menuEdit").onclick = () => {
        window.open(`admin.html#edit=${encodeURIComponent(item.id)}`, "_blank", "noopener");
        closeMenu();
      };
      menu.querySelector("#menuForget").onclick = () => { localStorage.removeItem(PAT_KEY); closeMenu(); };
    }
    positionMenu(btn);
    menu.classList.remove("hidden");
  }

  function showListPicker() {
    const menu = $("actionMenu"), item = menuTarget;
    if (!lists.length) {
      menu.innerHTML = `<p class="menu-hint">No lists yet — create one in Admin first.</p>
        <div class="menu-actions"><button class="menu-btn" id="menuCancel">Close</button></div>`;
      menu.querySelector("#menuCancel").onclick = closeMenu;
      return;
    }
    menu.innerHTML = `<p class="menu-hint">Add "${item.title}" to:</p>` +
      lists.map(l => `<label class="menu-check"><input type="checkbox" value="${l.id}" ${l.items.includes(item.id) ? "checked" : ""}> ${l.title}</label>`).join("") +
      `<div class="menu-actions"><button class="menu-btn primary" id="menuSave">Save</button><button class="menu-btn" id="menuCancel">Cancel</button></div>
       <p class="menu-status" id="menuStatus"></p>`;
    menu.querySelector("#menuCancel").onclick = closeMenu;
    menu.querySelector("#menuSave").onclick = saveListMembership;
  }

  async function saveListMembership() {
    const menu = $("actionMenu"), item = menuTarget;
    const checked = new Set([...menu.querySelectorAll('input[type="checkbox"]:checked')].map(c => c.value));
    menu.querySelector("#menuStatus").textContent = "Saving…";
    try {
      const res = await ghGet("data/lists.json");
      const data = JSON.parse(b64d(res.content));
      data.forEach(l => {
        const has = l.items.includes(item.id);
        const want = checked.has(l.id);
        if (want && !has) l.items.push(item.id);
        if (!want && has) l.items = l.items.filter(x => x !== item.id);
      });
      await ghPut("data/lists.json", data, res.sha, `Update list membership for ${item.title}`);
      lists = data;
      menu.querySelector("#menuStatus").innerHTML = '<span class="ok">✓ saved — live in ~1 min</span>';
      setTimeout(closeMenu, 1200);
    } catch (e) {
      menu.querySelector("#menuStatus").innerHTML = `<span class="err">${e.message}</span>`;
    }
  }

  function showCategoryPicker() {
    const menu = $("actionMenu"), item = menuTarget;
    const enabled = categories.filter(c => c.enabled);
    menu.innerHTML = `<p class="menu-hint">Show "${item.title}" under:</p>` +
      enabled.map(c => `<label class="menu-check"><input type="checkbox" value="${c.id}" ${(item.categories || []).includes(c.id) ? "checked" : ""}> ${c.emoji} ${c.name}</label>`).join("") +
      `<div class="menu-actions"><button class="menu-btn primary" id="menuSave">Save</button><button class="menu-btn" id="menuCancel">Cancel</button></div>
       <p class="menu-status" id="menuStatus"></p>`;
    menu.querySelector("#menuCancel").onclick = closeMenu;
    menu.querySelector("#menuSave").onclick = saveCategoryMembership;
  }

  async function saveCategoryMembership() {
    const menu = $("actionMenu"), item = menuTarget;
    const checked = [...menu.querySelectorAll('input[type="checkbox"]:checked')].map(c => c.value);
    if (!checked.length) { menu.querySelector("#menuStatus").innerHTML = '<span class="err">Pick at least one category.</span>'; return; }
    menu.querySelector("#menuStatus").textContent = "Saving…";
    try {
      const res = await ghGet(item.__file);
      const data = JSON.parse(b64d(res.content));
      const entry = data.find(e => e.id === item.id);
      if (!entry) throw new Error("Entry not found in its home file");
      entry.categories = checked;
      await ghPut(item.__file, data, res.sha, `Update categories for ${item.title}`);
      item.categories = checked;
      allItemsCache = null;
      menu.querySelector("#menuStatus").innerHTML = '<span class="ok">✓ saved — live in ~1 min</span>';
      setTimeout(async () => {
        closeMenu();
        const activeBtn = document.querySelector("#cats button.active") || document.querySelector("#cats button");
        if (activeList) await selectList(activeList);
        else if (activeCat && activeCat.id === "__all__") await selectAll(activeBtn);
        else if (activeCat) await selectCategory(activeCat, activeBtn);
      }, 900);
    } catch (e) {
      menu.querySelector("#menuStatus").innerHTML = `<span class="err">${e.message}</span>`;
    }
  }

  $("actionMenu").addEventListener("click", e => e.stopPropagation());
  document.addEventListener("click", e => {
    const menu = $("actionMenu");
    if (!menu.classList.contains("hidden") && !e.target.classList.contains("burger-btn")) {
      closeMenu();
    }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

  $("search").oninput = e => { state.search = e.target.value; render(); };
  $("typeFilter").onchange = e => { state.type = e.target.value; render(); };
  $("countryFilter").onchange = e => { state.country = e.target.value; render(); };
  $("sort").onchange = e => { state.sort = e.target.value; render(); };
  $("favToggle").onclick = () => { state.favsOnly = !state.favsOnly; render(); };
  $("shareBtn").onclick = e => copyShareLink(e.currentTarget);
  $("focusBtn").onclick = e => copyFocusedLink(e.currentTarget);
  $("privateBtn").onclick = async () => {
    showPrivate = false;
    localStorage.setItem(PRIVATE_KEY, "0");
    allItemsCache = null;
    await loadCategories();
    if (activeList) await selectList(activeList);
    else if (activeCat) activeCat.id === "__all__"
      ? await selectAll(catButtons["all"])
      : await selectCategory(activeCat, catButtons[activeCat.id]);
    render();
  };
  $("resetBtn").onclick = () => {
    state.search = ""; state.type = ""; state.country = ""; state.favsOnly = false;
    state.tags.clear();
    $("search").value = ""; $("typeFilter").value = ""; $("countryFilter").value = "";
    render();
  };

  // ---------- SHAREABLE URLS ----------
  // Everything you're looking at is encoded in the hash, e.g.
  // #cat=k-dramas&tags=romance,melodrama&q=office&sort=rating
  function syncHash() {
    if (applyingHash) return;
    const p = [];
    if (activeList) p.push("list=" + activeList.id);
    else if (activeCat) p.push("cat=" + (activeCat.id === "__all__" ? "all" : activeCat.id));
    if (onlyMode) p.push("only=1");
    if (state.tags.size) p.push("tags=" + [...state.tags].join(","));
    if (state.search) p.push("q=" + encodeURIComponent(state.search));
    if (state.type) p.push("type=" + state.type);
    if (state.country) p.push("country=" + state.country);
    if (state.favsOnly) p.push("fav=1");
    if (state.sort && state.sort !== "title") p.push("sort=" + state.sort);
    const h = p.length ? "#" + p.join("&") : "";
    if (location.hash !== h) history.replaceState(null, "", location.pathname + location.search + h);
  }

  function parseHash(hash) {
    const out = {};
    (hash || "").replace(/^#/, "").split("&").forEach(kv => {
      const [k, ...rest] = kv.split("=");
      if (k) out[k] = decodeURIComponent(rest.join("="));
    });
    return out;
  }

  async function applyHash(hash) {
    const p = parseHash(hash);
    // unlock/lock private entries for this browser (never included in copied links)
    if (p.private === "1" || p.private === "0") {
      showPrivate = p.private === "1";
      localStorage.setItem(PRIVATE_KEY, showPrivate ? "1" : "0");
      allItemsCache = null;
      await loadCategories();
    }
    if (p.only === "1") setOnlyMode(true);
    if (!p.list && !p.cat) return false;
    applyingHash = true;
    try {
      if (p.list) {
        const l = lists.find(x => x.id === p.list);
        if (!l) return false;
        await selectList(l);
      } else if (p.cat === "all") {
        await selectAll(catButtons["all"]);
      } else {
        const c = categories.find(x => x.id === p.cat && x.enabled && (showPrivate || !x.private));
        if (!c) return false;
        await selectCategory(c, catButtons[p.cat]);
      }
      // layered on top, because selecting a category resets the filters
      if (p.q) { state.search = p.q; $("search").value = p.q; }
      if (p.type) { state.type = p.type; $("typeFilter").value = p.type; }
      if (p.country) { state.country = p.country; $("countryFilter").value = p.country; }
      if (p.sort) { state.sort = p.sort; $("sort").value = p.sort; }
      if (p.fav === "1") state.favsOnly = true;
      if (p.tags) p.tags.split(",").filter(Boolean).forEach(t => state.tags.add(t));
    } finally {
      applyingHash = false;
    }
    render();
    return true;
  }

  function setOnlyMode(on) {
    onlyMode = on;
    $("cats").style.display = on ? "none" : "";
    $("lists").style.display = on ? "none" : "";
    document.body.classList.toggle("only-mode", on);
  }

  async function copyFocusedLink(btn) {
    if (!activeList) return;
    const url = `${location.origin}${location.pathname}#list=${activeList.id}&only=1`;
    try {
      await navigator.clipboard.writeText(url);
      const old = btn.textContent;
      btn.textContent = "✓ Focused link copied!";
      setTimeout(() => btn.textContent = old, 2200);
    } catch { prompt("Copy this link:", url); }
  }

  async function copyShareLink(btn) {
    syncHash();
    try {
      await navigator.clipboard.writeText(location.href);
      const old = btn.textContent;
      btn.textContent = "✓ Link copied!";
      setTimeout(() => btn.textContent = old, 2000);
    } catch {
      prompt("Copy this link:", location.href);
    }
  }

  (async () => {
    $("sort").value = state.sort;
    const initialHash = location.hash; // captured before selectCategory strips it
    try { tagInfo = await (await fetch("data/tags.json")).json(); } catch { tagInfo = {}; }
    try { tagGroups = await (await fetch("data/tag-groups.json")).json(); } catch { tagGroups = []; }
    await loadCategories();
    await loadLists();
    const matched = await applyHash(initialHash);
    if (!matched) renderPlaceholder();
    window.addEventListener("hashchange", () => applyHash(location.hash));
  })().catch(err => {
    $("grid").innerHTML = `<div class="empty">Couldn't load data (${err.message}).<br>If you opened this file directly, serve it instead: <code>python3 -m http.server</code></div>`;
  });
})();
</script>
